<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Registration</title>
  </head>
  <body>
    <h1>Race Registration!</h1>
    <form>
      <div>
        <label for="first-name">First Name</label>
        <input id="first-name" type="text" required />
        <label for="last-name">Last Name</label>
        <input id="last-name" type="text" required />
        <br />
      </div>
      <h3>Select a Race:</h3>
      <div>
        <input type="radio" id="fun" name="race" value="funrun" />
        <label for="fun">Fun Run 5k</label><br />
      </div>

      <div>
        <input type="radio" id="half" name="race" value="halfrun" />
        <label for="half">Half Marathon</label><br />
      </div>
      <div>
        <input type="radio" id="full" name="race" value="fullrun" />
        <label for="full">Full Marathon</label><br />
      </div>
      <br />
      <label for="email">Email</label>
      <input id="email" type="text" required />
      <label for="pass">Password</label>
      <input id="pass" type="text" required />

      <br />

      <label for="age-select">Select Age Group:</label>
      <select name="age" id="age-select">
        <option value="teen">under 18</option>
        <option value="adult">18-64</option>
        <option value="old">over 65</option>
      </select>

      <button type="submit">Register!</button>
      <br />
    </form>
  </body>
</html>
